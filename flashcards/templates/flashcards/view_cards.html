{% extends 'flashcards/base.html' %}

{% block title %}Карточки{% endblock %}

{% block content %}
  <h2>Карточки</h2>

  {% if cards %}
    <ul class="list-group">
      {% for card in cards %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <strong>{{ card.word }}</strong> — {{ card.translation }}
          </div>
          <form method="post" action="{% url 'delete_card' card.id %}" style="margin: 0;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Пока нет карточек.</p>
  {% endif %}
{% endblock %}
